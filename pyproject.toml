[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "accordlens"
version = "1.0.0"
description = "Preference alignment experiments and LLM judge reliability audits"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "transformers>=4.55,<5", "peft>=0.17,<0.19", "numpy>=2,<3", "pandas>=2.2,<4", "matplotlib>=3.9,<4", "scikit-learn>=1.6,<2", "pyarrow>=19,<27", "openpyxl>=3.1,<4", "sentencepiece>=0.2,<0.3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "build>=1,<2"]
[project.scripts]
accordlens = "accordlens.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 88
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
